site_name: Documentation Site - Kuwait & Iraq vACC
site_url: https://docs.kuwait-iraqvacc.net

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  font:
    text: Mulish
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Light mode

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.tooltips

  icon:
    repo: fontawesome/brands/github
    admonition:
      example: fontawesome/solid/headset

extra:
  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/
    - icon: fontawesome/brands/discord
      link: https://community.vatsim.net
    - icon: fontawesome/brands/twitch
      link: https://www.twitch.tv/
    - icon: fontawesome/brands/github
      link: https://github.com/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/

extra_css:
  - stylesheets/extra.css
  - stylesheets/briefing.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - abbr
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - toc:
      permalink: true
  - md_in_html

plugins:
  - search
  - blog:
      blog_dir: Controller Guidance/Procedure Updates/Updates
      blog_toc: true
      archive_name: Past Updates
      categories_name: Update Types
      post_date_format: long
      post_excerpt: required
      post_excerpt_separator: <!-- more -->
      categories_allowed:
        - Procedure Changes
        - Procedure NOTAMs
  - tags:
      tags_file: Controller Guidance/Procedure Updates/Updates/tags.md
  - awesome-nav
  - git-revision-date-localized:
      enabled: true
      type: date
      timezone: UTC
      fallback_to_build_date: true

copyright: ""
name: Build docs and publish site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'includes/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # <-- full git log, required for per-page revision dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet && echo "No changes to site/" || (
            git commit -m "chore: rebuild site [skip ci]"
            git push
          )
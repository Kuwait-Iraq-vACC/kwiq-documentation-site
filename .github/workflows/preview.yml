name: Preview Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Secrets are not available to PRs from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # full history — required by git-revision-date-localized

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build

      # Uploads a new Worker version without deploying it, so production is untouched
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} (${HEAD_SHA:0:8})" | tee "$RUNNER_TEMP/wrangler.log"

          entry=$(grep '"type":"version-upload"' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1 || true)
          commit_url=$(jq -r '.preview_url // empty' <<< "$entry")
          alias_url=$(jq -r '.preview_alias_url // empty' <<< "$entry")

          # Fall back to the human-readable output if the output file format changes
          if [ -z "$commit_url" ]; then
            commit_url=$(grep -oE 'Version Preview URL: https://\S+' "$RUNNER_TEMP/wrangler.log" | awk '{print $NF}' | tail -n 1 || true)
          fi
          if [ -z "$alias_url" ]; then
            alias_url=$(grep -oE 'Version Preview Alias URL: https://\S+' "$RUNNER_TEMP/wrangler.log" | awk '{print $NF}' | tail -n 1 || true)
          fi

          if [ -z "$commit_url" ]; then
            echo "::error::No preview URL in wrangler output. Check that Preview URLs are enabled for the Worker."
            exit 1
          fi

          echo "commit_url=$commit_url" >> "$GITHUB_OUTPUT"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployed"
            echo "- Commit: $commit_url"
            [ -n "$alias_url" ] && echo "- PR: $alias_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          COMMIT_URL: ${{ steps.upload.outputs.commit_url }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
        with:
          script: |
            const marker = '<!-- docs-preview -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha.slice(0, 8);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ok = process.env.OUTCOME === 'success';
            const updated = new Date().toLocaleString('en-US', {
              timeZone: 'UTC', month: 'short', day: '2-digit', year: 'numeric',
              hour: '2-digit', minute: '2-digit',
            }).replace(/^(\w{3} \d{2}),/, '$1');

            const status = ok
              ? `✅ Deployment successful! <br>[View logs](${runUrl})`
              : `❌ Deployment failed <br>[View logs](${runUrl})`;
            const links = ok
              ? [
                  `<a href='${process.env.COMMIT_URL}'>Commit Preview URL</a>`,
                  process.env.ALIAS_URL && `<br><a href='${process.env.ALIAS_URL}'>PR Preview URL</a>`,
                ].filter(Boolean).join('')
              : '—';

            const body = [
              marker,
              '## Deploying with Cloudflare Workers',
              'The latest updates on this PR. The PR Preview URL always points at the newest commit.',
              '',
              '| Status | Name | Latest Commit | Preview URL | Updated (UTC) |',
              '| - | - | - | - | - |',
              `| ${status} | ${repo} | ${sha} | ${links} | ${updated} |`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
